name: Tank93 Web Pure - E2E & Unit

on:
  push:
    branches: [ main ]
    paths:
      - 'web-pure/**'
      - 'game/levels/**'
      - 'game/settings.py'
      - 'scripts/generate_web_assets.py'
      - 'docs/WEB_SYNC_CONTRACT.md'
      - 'docs/LOG_EVENT_SCHEMA.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'web-pure/**'
      - 'game/**'
      - 'scripts/**'

jobs:
  asset-sync-check:
    name: Asset Sync Check (Python source -> web-pure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          pip install pygame-ce==2.5.7
      - name: Check web assets in sync with Python source
        run: |
          python scripts/generate_web_assets.py --check
          echo "✅ Assets in sync: maps.json 35 stages, settings.json $(python -c 'import json; print(len(json.load(open("web-pure/assets/settings.json"))))') keys"

  web-unit:
    name: Web Unit Tests (vitest - 22 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-pure/package-lock.json
      - name: Install deps
        working-directory: web-pure
        run: npm ci
      - name: Run unit tests
        working-directory: web-pure
        run: npm test

  web-e2e:
    name: Web E2E Tests (Playwright - 7 tests mirroring Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-pure/package-lock.json
      - name: Install Node deps
        working-directory: web-pure
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web-pure
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: web-pure
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-pure/playwright-report/
            web-pure/test-results/
          if-no-files-found: ignore
      - name: Upload web debug logs (if ?debug overlay exported)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            web-pure/playwright-report/
            web-pure/debug_logs.json
          if-no-files-found: ignore
